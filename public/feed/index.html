<!doctype html>
<meta charset="utf-8">
<title>RSS 已搬到 /rss.xml</title>
<!-- 舊站的 RSS 在 /feed/。Astro 的 redirects 會被 trailingSlash:'always' 加上斜線
     變成 /rss.xml/（錯的檔名），所以這頁手寫放在 public/ 裡，不經 Astro 轉址機制。 -->
<meta http-equiv="refresh" content="0;url=/rss.xml">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://gcm.org.tw/rss.xml">
<link rel="alternate" type="application/rss+xml" href="https://gcm.org.tw/rss.xml">
<p>本站 RSS 已改到 <a href="/rss.xml">/rss.xml</a>。</p>
